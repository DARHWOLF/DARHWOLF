name: Update README with Open PRs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch Open PRs
        id: fetch-prs
        run: |
          echo "Fetching open PRs for user DARHWOLF..."

          curl -fsS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/search/issues?q=is:pr+is:open+author:DARHWOLF+archived:false&sort=updated&per_page=10" \
            > prs.json

          echo "## My Open Pull Requests" > pr_section.md
          echo "" >> pr_section.md

          pr_count=$(jq '.total_count' prs.json)

          if [ "$pr_count" -eq 0 ]; then
            echo "No open pull requests at the moment." >> pr_section.md
          else
            jq -r '.items[] | "- [\(.title)](\(.html_url)) - \(.repository_url | split("/") | .[-1]) - Updated: \(.updated_at | split("T")[0])"' prs.json >> pr_section.md
          fi

          echo "" >> pr_section.md
          echo "*Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')*" >> pr_section.md

      - name: Update README
        run: |
          if grep -q "<!-- OPEN_PRS:START -->" README.md && grep -q "<!-- OPEN_PRS:END -->" README.md; then
            awk '
              /<!-- OPEN_PRS:START -->/ {print; system("cat pr_section.md"); skip=1; next}
              /<!-- OPEN_PRS:END -->/ {skip=0}
              !skip
            ' README.md > README.tmp && mv README.tmp README.md
          else
            echo "" >> README.md
            echo "<!-- OPEN_PRS:START -->" >> README.md
            cat pr_section.md >> README.md
            echo "<!-- OPEN_PRS:END -->" >> README.md
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update README"

          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then
                echo "Successfully pushed changes"
                exit 0
              fi
            fi

            # Clean up an unsuccessful rebase before retrying
            git rebase --abort || true

            echo "Retrying push (${attempt}/3)..."
            sleep 3
          done

          exit 1
